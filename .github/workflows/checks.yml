name: Check Flagship Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rocky:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rocky: [9, 10]
    steps:
      - uses: actions/checkout@v4
      - run: CONTAINER_ENGINE=docker bash build.sh ${{ matrix.rocky }}
      - run: CONTAINER_ENGINE=docker bash packaging/test-offline.sh ${{ matrix.rocky }}
